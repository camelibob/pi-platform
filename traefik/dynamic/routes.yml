http:
  middlewares:
    ratelimit:
      rateLimit:
        average: 10
        period: 1s
        burst: 20

  routers:
    app:
      rule: "Host(`app.pi.home.arpa`)"
      entryPoints: [websecure]
      service: app
      middlewares: [ratelimit]

  services:
    app:
      loadBalancer:
        servers:
          - url: "http://app:8000"